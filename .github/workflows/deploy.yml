# Deploys to Cloudflare on every push to main.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN, created from the
# "Edit Cloudflare Workers" template. Until it exists the job skips with a
# warning rather than failing, so the repo does not show a red run before setup.
# See README "Continuous deployment".

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# A newer push makes an in-flight deploy pointless, but never cancel a run that
# is already mid-deploy, or the Worker could be left half-updated.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches a broken wrangler.toml or a bundling error before it can touch
      # the live Worker.
      - name: Validate the build
        run: npx wrangler deploy --dry-run --outdir=.wrangler/ci

      - name: Check the Cloudflare token is configured
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the deploy was skipped. Add it in Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.token.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Summary
        if: steps.token.outputs.ready == 'true'
        run: echo "Deployed to https://tech.bootdev-progress.workers.dev" >> "$GITHUB_STEP_SUMMARY"
