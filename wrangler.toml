# Cloudflare Worker config.
#
# Before the first deploy, two values need filling in (see README "Deploy"):
#   1. `name`            the subdomain, e.g. bootdev-progress.<you>.workers.dev
#   2. kv_namespaces id  created by: npx wrangler kv namespace create HISTORY

# The host is <name>.<account subdomain>.workers.dev, so a short name here is the
# only part shortenable from code. The subdomain itself is a dashboard setting.
name = "tech"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# Serves everything in public/ (index.html, styles.css, app.js, vendor/chart.umd.js).
# run_worker_first keeps /api/progress on the Worker instead of 404ing on assets.
# Each deploy gets its own version id, which /api/version hands to the page so a
# reload can spot a payload cached before the current release. Avoids a build step.
[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Daily history. Replaces history.json, which serverless has no disk for.
[[kv_namespaces]]
binding = "HISTORY"
id = "8d7c868a810142ce8bf1f0b2423dafa1"

# Records totals every hour so pace and streak stay accurate on days you do not
# open the page. Writes only happen when a value actually changed.
[triggers]
crons = ["0 * * * *"]

[vars]
BOOTDEV_HANDLE = "the_baaneh"
BOOTDEV_PATH = "backend"
# Day boundaries for "today" and streak counting, so a day rolls over when yours
# does rather than at UTC midnight.
BOOTDEV_TZ = "Africa/Cairo"
# The day the current streak began, YYYY-MM-DD. boot.dev keeps both the live
# streak and the ember balance behind auth, so this is the only way the
# dashboard can know the real number; it counts forward from here on its own.
# This day counts as day 1, not day 0, so read it off the streak boot.dev shows:
# today minus (streak - 1) days. A 16-day streak on Aug 9 began Jul 25.
# Clear it to fall back to estimating from the streak achievements.
BOOTDEV_STREAK_SINCE = "2026-07-25"

[observability]
enabled = true
